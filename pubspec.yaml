name: mortenzen_martes
description: "App de Monitoreo Deportivo Inteligente - Mortenzen Martes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8

  # Maps & Location (OpenStreetMap - free)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.0

  # Sensors
  sensors_plus: ^6.1.1

  # Charts
  fl_chart: ^0.70.2

  # Networking
  http: ^1.4.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
